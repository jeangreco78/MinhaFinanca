<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#087f5b">
<link rel="manifest" href="manifest.json">
<title>Minha Finança</title>
<style>
:root{--green:#087f5b;--green2:#0ca678;--bg:#f4f7f6;--card:#fff;--text:#17312b;--muted:#6b7f79;--red:#e5484d;--blue:#315ee7;--yellow:#e5a100;--line:#e5ece9;--shadow:0 4px 18px rgba(24,56,47,.08)}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:520px;margin:auto;min-height:100vh;background:var(--bg);padding-bottom:78px}.top{background:linear-gradient(135deg,#087f5b,#075c43);color:#fff;padding:18px 16px 20px;border-radius:0 0 22px 22px;position:sticky;top:0;z-index:5}.toprow{display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:800}.sub{font-size:12px;opacity:.82}.monthrow{display:flex;align-items:center;justify-content:space-between;margin-top:16px}.monthrow button{background:#ffffff18;border:1px solid #ffffff2c;color:#fff;border-radius:10px;padding:6px 10px}.content{padding:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:var(--card);border-radius:15px;padding:14px;box-shadow:var(--shadow);margin-bottom:12px}.balance{grid-column:1/-1}.label{font-size:12px;color:var(--muted)}.big{font-size:27px;font-weight:800;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.blue{color:var(--blue)}.small{font-size:12px}.section-title{display:flex;justify-content:space-between;align-items:center;margin:17px 2px 9px;font-weight:800}.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:700}.primary{background:var(--green);color:#fff}.secondary{background:#e9f5f0;color:var(--green)}.danger{background:#fff0f0;color:var(--red)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}.item:last-child{border-bottom:0}.icon{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#e9f5f0;color:var(--green);font-weight:800}.icon.red{background:#fff0f0}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);height:72px;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);z-index:10;padding-bottom:env(safe-area-inset-bottom)}.nav button{border:0;background:none;color:#7a8a86;font-size:11px}.nav button.active{color:var(--green);font-weight:800}.nav .nicon{display:block;font-size:21px;margin-bottom:3px}.fab{position:fixed;right:max(18px,calc((100vw - 520px)/2 + 18px));bottom:88px;width:54px;height:54px;border:0;border-radius:50%;background:var(--green);color:#fff;font-size:28px;box-shadow:0 8px 20px #087f5b55;z-index:9}.tabs{display:flex;background:#eaf0ee;padding:4px;border-radius:11px;margin-bottom:12px}.tabs button{flex:1;border:0;border-radius:8px;background:none;padding:9px;font-size:12px;color:var(--muted)}.tabs button.active{background:#fff;color:var(--green);font-weight:800;box-shadow:0 1px 5px #0000000c}.form label{font-size:12px;color:var(--muted);display:block;margin:10px 0 5px}.form input,.form select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.form input:focus,.form select:focus{border-color:var(--green)}.form .actions{display:flex;gap:8px;margin-top:15px}.form .actions>*{flex:1}.hidden{display:none!important}.empty{text-align:center;color:var(--muted);padding:25px 5px}.chart{height:230px;display:flex;align-items:flex-end;gap:10px;padding:20px 8px 10px}.barwrap{flex:1;height:100%;display:flex;align-items:flex-end;gap:3px;justify-content:center}.bar{width:45%;min-height:3px;border-radius:6px 6px 2px 2px}.bar.rev{background:var(--green2)}.bar.exp{background:var(--red)}.barlabel{font-size:9px;color:var(--muted);text-align:center;margin-top:5px}.legend{display:flex;gap:16px;font-size:11px;color:var(--muted);margin-bottom:8px}.dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}.dot.g{background:var(--green2)}.dot.r{background:var(--red)}.progress{height:9px;background:#edf1ef;border-radius:9px;overflow:hidden}.progress span{display:block;height:100%;background:var(--green);border-radius:9px}.modal{position:fixed;inset:0;background:#0008;z-index:30;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:min(520px,100%);border-radius:22px 22px 0 0;padding:18px;max-height:92vh;overflow:auto}.close{float:right;border:0;background:#edf1ef;border-radius:50%;width:32px;height:32px}.toast{position:fixed;left:50%;bottom:85px;transform:translateX(-50%);background:#18312b;color:#fff;padding:11px 16px;border-radius:12px;font-size:13px;z-index:50;box-shadow:var(--shadow)}.notice{background:#fff8df;color:#785800;padding:11px;border-radius:12px;font-size:12px;margin-bottom:12px}.switch{display:flex;background:#eef3f1;border-radius:10px;padding:3px}.switch button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:12px}.switch button.active{background:#fff;color:var(--green);font-weight:800}.pill{font-size:10px;padding:4px 7px;border-radius:20px;background:#eaf5f1;color:var(--green)}.pill.red{background:#fff0f0;color:var(--red)}@media(min-width:521px){body{padding:20px 0}.app{border-radius:22px;box-shadow:0 10px 50px #00000012;overflow:hidden}.top{position:relative}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="toprow"><div><div class="brand">Minha Finança</div><div class="sub">Seu dinheiro, no controle</div></div><div>🔔</div></div><div class="monthrow"><button id="prevMonth">‹</button><strong id="monthTitle"></strong><button id="nextMonth">›</button></div></header>
<main class="content" id="screen"></main>
</div>
<button class="fab" id="fab">+</button>
<nav class="nav"><button data-screen="home" class="active"><span class="nicon">⌂</span>Início</button><button data-screen="transactions"><span class="nicon">▤</span>Lançamentos</button><button data-screen="charts"><span class="nicon">▥</span>Gráficos</button><button data-screen="more"><span class="nicon">•••</span>Mais</button></nav>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='minha-financa-v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{transactions:[
{id:1,type:'income',value:4500,date:new Date().toISOString().slice(0,8)+'02',category:'Salário',description:'Salário',status:'paid',account:'Conta principal'},
{id:2,type:'expense',value:289.90,date:new Date().toISOString().slice(0,8)+'01',category:'Alimentação',description:'Supermercado',status:'paid',account:'Conta principal'},
{id:3,type:'expense',value:150,date:new Date().toISOString().slice(0,8)+'01',category:'Transporte',description:'Combustível',status:'paid',account:'Conta principal'}],future:[{id:101,type:'expense',value:1500,date:dateAdd(7),category:'Moradia',description:'Aluguel',recurrence:'Mensal',status:'pending'},{id:102,type:'expense',value:120,date:dateAdd(12),category:'Serviços',description:'Internet',recurrence:'Mensal',status:'pending'},{id:103,type:'income',value:800,date:dateAdd(16),category:'Vendas',description:'Cliente',recurrence:'Avulsa',status:'pending'}],categories:{income:['Salário','Vendas','Freelancer','Investimentos','Outros'],expense:['Moradia','Alimentação','Transporte','Saúde','Educação','Lazer','Serviços','Fornecedores','Impostos','Outros']},cards:[]};
let selectedDate=new Date(); selectedDate.setDate(1); let current='home';
function dateAdd(days){const d=new Date();d.setDate(d.getDate()+days);return iso(d)}function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}function save(){localStorage.setItem(KEY,JSON.stringify(state))}function brl(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}function fmtDate(s){return new Date(s+'T12:00:00').toLocaleDateString('pt-BR')}function monthKey(s){return s.slice(0,7)}function currentMonth(){return selectedDate.toISOString().slice(0,7)}function sum(list,type){return list.filter(x=>!type||x.type===type).reduce((a,x)=>a+Number(x.value),0)}function monthTransactions(){return state.transactions.filter(x=>monthKey(x.date)===currentMonth())}function allForProjection(){return [...state.transactions,...state.future]}
function render(){document.getElementById('monthTitle').textContent=selectedDate.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).replace(/^./,c=>c.toUpperCase());document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.screen===current));({home:renderHome,transactions:renderTransactions,charts:renderCharts,more:renderMore}[current])();}
function renderHome(){const tx=monthTransactions(), inc=sum(tx,'income'),exp=sum(tx,'expense'),bal=sum(state.transactions,'income')-sum(state.transactions,'expense'),futureInc=sum(state.future.filter(x=>new Date(x.date)>=new Date()),'income'),futureExp=sum(state.future.filter(x=>new Date(x.date)>=new Date()),'expense');const cats=state.categories.expense.map(c=>({c,v:sum(tx.filter(x=>x.category===c),'expense')})).filter(x=>x.v).sort((a,b)=>b.v-a.v).slice(0,4);document.getElementById('screen').innerHTML=`<div class="grid"><div class="card balance"><div class="label">Saldo atual</div><div class="big">${brl(bal)}</div><div class="small ${bal>=0?'green':'red'}">${bal>=0?'Saldo positivo':'Atenção: saldo negativo'}</div></div><div class="card"><div class="label">Receitas do mês</div><div class="big green" style="font-size:20px">${brl(inc)}</div></div><div class="card"><div class="label">Despesas do mês</div><div class="big red" style="font-size:20px">${brl(exp)}</div></div></div><div class="card"><div class="row"><div><div class="label">Saldo projetado</div><strong style="font-size:20px">${brl(bal+futureInc-futureExp)}</strong></div><span class="pill">Próximos compromissos</span></div><div class="small" style="margin-top:5px">Receitas futuras ${brl(futureInc)} · Despesas futuras ${brl(futureExp)}</div></div><div class="section-title">Resumo do mês <button class="btn secondary" onclick="go('charts')">Ver gráficos</button></div><div class="card"><div class="legend"><span><i class="dot g"></i>Receitas</span><span><i class="dot r"></i>Despesas</span></div><div class="chart" id="miniChart"></div></div><div class="section-title">Próximas contas</div><div class="card">${renderFutureItems(3)}</div><div class="section-title">Maiores despesas</div><div class="card">${cats.length?cats.map(x=>`<div class="item"><div style="flex:1"><div class="row"><strong>${x.c}</strong><span>${brl(x.v)}</span></div><div class="progress" style="margin-top:7px"><span style="width:${Math.min(100,x.v/(exp||1)*100)}%"></span></div></div></div>`).join(''):'<div class="empty">Nenhuma despesa no mês.</div>'}</div>`;drawMiniChart();}
function drawMiniChart(){const el=document.getElementById('miniChart');if(!el)return;let days=Array.from({length:4},(_,i)=>i);let max=Math.max(1,...days.flatMap(i=>[sum(monthTransactions().filter(x=>Math.floor((+x.date.slice(8))/8)===i+1),'income'),sum(monthTransactions().filter(x=>Math.floor((+x.date.slice(8))/8)===i+1),'expense')]));el.innerHTML=days.map((i)=>{let a=sum(monthTransactions().filter(x=>Math.floor((+x.date.slice(8))/8)===i+1),'income'),b=sum(monthTransactions().filter(x=>Math.floor((+x.date.slice(8))/8)===i+1),'expense');return `<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end"><div class="barwrap" style="height:90%"><div class="bar rev" style="height:${a/max*100}%" title="${brl(a)}"></div><div class="bar exp" style="height:${b/max*100}%" title="${brl(b)}"></div></div><div class="barlabel">${i*8+1}-${i*8+7}</div></div>`}).join('')}
function renderTransactions(){const tx=monthTransactions().sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('screen').innerHTML=`<div class="tabs"><button class="active">Todos</button><button onclick="filterTx('income')">Receitas</button><button onclick="filterTx('expense')">Despesas</button></div><div class="card"><div class="row"><strong>${tx.length} lançamentos</strong><button class="btn secondary" onclick="openForm()">+ Novo</button></div></div><div class="card" id="txList">${renderTxList(tx)}</div>`}
function filterTx(type){const tx=monthTransactions().filter(x=>x.type===type).sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('txList').innerHTML=renderTxList(tx)}function renderTxList(tx){return tx.length?tx.map(x=>`<div class="item"><div class="icon ${x.type==='expense'?'red':''}">${x.type==='expense'?'−':'+'}</div><div style="flex:1"><strong>${x.description||x.category}</strong><div class="small">${x.category} · ${fmtDate(x.date)} · ${x.status==='paid'?'Pago/Recebido':'Pendente'}</div></div><div class="${x.type==='expense'?'red':'green'}" style="font-weight:800">${x.type==='expense'?'−':'+'}${brl(x.value)}</div></div>`).join(''):'<div class="empty">Nenhum lançamento neste mês.</div>'}
function renderFutureItems(n=20){const list=state.future.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(0,n);return list.length?list.map(x=>`<div class="item"><div class="icon ${x.type==='expense'?'red':''}">${x.type==='expense'?'$':'↑'}</div><div style="flex:1"><strong>${x.description}</strong><div class="small">${fmtDate(x.date)} · ${x.recurrence||'Avulsa'}</div></div><div class="${x.type==='expense'?'red':'green'}" style="font-weight:800">${brl(x.value)}</div></div>`).join(''):'<div class="empty">Nenhuma conta futura cadastrada.</div>'}
function renderCharts(){const months=[];for(let i=5;i>=0;i--){let d=new Date(selectedDate);d.setMonth(d.getMonth()-i);months.push(d)}const data=months.map(d=>{const k=iso(d).slice(0,7);const tx=state.transactions.filter(x=>monthKey(x.date)===k);return {label:d.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),income:sum(tx,'income'),expense:sum(tx,'expense')}});const tx=monthTransactions();const cats=state.categories.expense.map(c=>({c,v:sum(tx.filter(x=>x.category===c),'expense')})).filter(x=>x.v).sort((a,b)=>b.v-a.v).slice(0,6);const max=Math.max(1,...data.flatMap(x=>[x.income,x.expense]));document.getElementById('screen').innerHTML=`<div class="tabs"><button class="active">6 meses</button><button onclick="alert('Use as setas do topo para mudar o período.')">Período</button></div><div class="card"><h3>Receitas x despesas</h3><div class="legend"><span><i class="dot g"></i>Receitas</span><span><i class="dot r"></i>Despesas</span></div><div class="chart">${data.map(x=>`<div style="flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end"><div class="barwrap" style="height:90%"><div class="bar rev" style="height:${x.income/max*100}%" title="${brl(x.income)}"></div><div class="bar exp" style="height:${x.expense/max*100}%" title="${brl(x.expense)}"></div></div><div class="barlabel">${x.label}</div></div>`).join('')}</div></div><div class="card"><h3>Despesas por categoria</h3>${cats.length?cats.map(x=>`<div style="margin:14px 0"><div class="row"><span>${x.c}</span><strong>${brl(x.v)}</strong></div><div class="progress" style="margin-top:6px"><span style="width:${Math.min(100,x.v/(sum(tx,'expense')||1)*100)}%"></span></div></div>`).join(''):'<div class="empty">Sem despesas para analisar.</div>'}</div><div class="card"><h3>Evolução do saldo</h3><div style="padding:12px 0">${data.map((x,i)=>{let k=months.slice(0,i+1).map(d=>iso(d).slice(0,7));let s=sum(state.transactions.filter(t=>k.includes(monthKey(t.date))),'income')-sum(state.transactions.filter(t=>k.includes(monthKey(t.date))),'expense');return `<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span>${x.label}</span><strong class="${s>=0?'green':'red'}">${brl(s)}</strong></div>`}).join('')}</div></div>`}
function renderMore(){document.getElementById('screen').innerHTML=`<div class="card"><div class="row"><div><strong>Controle financeiro</strong><div class="small">Escolha uma área</div></div></div></div><div class="card"><div class="item" onclick="renderFuturePage()"><div class="icon">📅</div><div style="flex:1"><strong>Contas futuras</strong><div class="small">Contas a pagar e receber</div></div>›</div><div class="item" onclick="renderCalendar()"><div class="icon">🗓</div><div style="flex:1"><strong>Calendário financeiro</strong><div class="small">Visualize seus compromissos</div></div>›</div><div class="item" onclick="renderCards()"><div class="icon">💳</div><div style="flex:1"><strong>Cartões</strong><div class="small">Controle de faturas</div></div>›</div><div class="item" onclick="renderCategories()"><div class="icon">☷</div><div style="flex:1"><strong>Categorias</strong><div class="small">Personalize suas categorias</div></div>›</div><div class="item" onclick="backup()"><div class="icon">↥</div><div style="flex:1"><strong>Exportar backup</strong><div class="small">Salvar seus dados em arquivo</div></div>›</div><div class="item" onclick="document.getElementById('importFile').click()"><div class="icon">↧</div><div style="flex:1"><strong>Importar backup</strong><div class="small">Restaurar dados</div></div>›</div></div><input type="file" id="importFile" accept="application/json" class="hidden" onchange="restore(event)"><div class="card"><div class="small">Os dados desta versão ficam salvos localmente no aparelho/navegador. Não envie informações bancárias reais durante o teste.</div></div>`}
function renderFuturePage(){current='more';document.getElementById('screen').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn secondary" onclick="render()">← Voltar</button><button class="btn primary" onclick="openFutureForm()">+ Conta futura</button></div><div class="tabs"><button class="active">Todas</button><button>Despesas</button><button>Receitas</button></div><div class="card">${renderFutureItems()}</div>`}
function renderCalendar(){current='more';const y=selectedDate.getFullYear(),m=selectedDate.getMonth();const days=new Date(y,m+1,0).getDate();document.getElementById('screen').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn secondary" onclick="render()">← Voltar</button><strong>Calendário financeiro</strong></div><div class="card"><div class="tabs"><button class="active">Mês</button><button>Semana</button><button>Ano</button></div><div style="display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:11px">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(x=>`<strong>${x}</strong>`).join('')}${Array(new Date(y,m,1).getDay()).fill('').map(()=>'<span></span>').join('')}${Array.from({length:days},(_,i)=>{let d=`${y}-${String(m+1).padStart(2,'0')}-${String(i+1).padStart(2,'0')}`;let count=state.future.filter(x=>x.date===d).length+state.transactions.filter(x=>x.date===d).length;return `<div style="padding:9px 2px;border-radius:8px;background:${count?'#e9f5f0':'transparent'}">${i+1}${count?`<div style="font-size:8px;color:var(--green)">●</div>`:''}</div>`}).join('')}</div></div><div class="section-title">Compromissos do mês</div><div class="card">${renderFutureItems()}</div>`}
function renderCards(){current='more';document.getElementById('screen').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn secondary" onclick="render()">← Voltar</button><button class="btn primary" onclick="addCard()">+ Cartão</button></div>${state.cards.length?state.cards.map(c=>`<div class="card" style="background:linear-gradient(135deg,#173d77,#315ee7);color:white"><div class="row"><strong>${c.name}</strong><span>${c.brand||'Cartão'}</span></div><div style="margin-top:28px;font-size:20px;letter-spacing:2px">•••• ${c.last4}</div><div class="row" style="margin-top:18px"><span class="small">Limite ${brl(c.limit)}</span><span class="small">Venc. dia ${c.due}</span></div></div>`).join(''):'<div class="card empty">Nenhum cartão cadastrado.<br><button class="btn primary" style="margin-top:10px" onclick="addCard()">Adicionar cartão</button></div>'}`}
function renderCategories(){current='more';document.getElementById('screen').innerHTML=`<div class="row" style="margin-bottom:10px"><button class="btn secondary" onclick="render()">← Voltar</button><button class="btn primary" onclick="addCategory()">+ Categoria</button></div><div class="card"><h3>Receitas</h3>${state.categories.income.map(x=>`<div class="item"><div class="icon">+</div><strong>${x}</strong></div>`).join('')}</div><div class="card"><h3>Despesas</h3>${state.categories.expense.map(x=>`<div class="item"><div class="icon red">−</div><strong>${x}</strong></div>`).join('')}</div>`}
function openForm(){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>Novo lançamento</h2><div class="switch"><button id="fIncome" class="active" onclick="setFormType('income')">Receita</button><button id="fExpense" onclick="setFormType('expense')">Despesa</button></div><form class="form" onsubmit="saveForm(event)"><input type="hidden" id="fType" value="income"><label>Valor</label><input id="fValue" type="number" step="0.01" min="0" required placeholder="0,00"><label>Data</label><input id="fDate" type="date" value="${iso(new Date())}" required><label>Categoria</label><select id="fCat"></select><label>Descrição</label><input id="fDesc" required placeholder="Ex.: Venda, salário, supermercado..."><label>Forma de pagamento</label><select id="fPay"><option>Pix</option><option>Dinheiro</option><option>Débito</option><option>Crédito</option><option>Transferência</option><option>Boleto</option></select><label>Status</label><select id="fStatus"><option value="paid">Pago/Recebido</option><option value="pending">Pendente</option></select><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>`;fillCats('income')}
function setFormType(t){document.getElementById('fType').value=t;document.getElementById('fIncome').classList.toggle('active',t==='income');document.getElementById('fExpense').classList.toggle('active',t==='expense');fillCats(t)}function fillCats(t){document.getElementById('fCat').innerHTML=state.categories[t].map(x=>`<option>${x}</option>`).join('')}function saveForm(e){e.preventDefault();const t=document.getElementById('fType').value;state.transactions.push({id:Date.now(),type:t,value:Number(document.getElementById('fValue').value),date:document.getElementById('fDate').value,category:document.getElementById('fCat').value,description:document.getElementById('fDesc').value,status:document.getElementById('fStatus').value,account:document.getElementById('fPay').value});save();closeModal();toast('Lançamento salvo');render()}
function openFutureForm(){document.getElementById('modalRoot').innerHTML=`<div class="modal"><div class="sheet"><button class="close" onclick="closeModal()">×</button><h2>Conta futura</h2><form class="form" onsubmit="saveFuture(event)"><label>Tipo</label><select id="uType"><option value="expense">Despesa</option><option value="income">Receita</option></select><label>Valor</label><input id="uValue" type="number" step="0.01" min="0" required><label>Data</label><input id="uDate" type="date" value="${dateAdd(7)}" required><label>Categoria</label><select id="uCat">${state.categories.expense.map(x=>`<option>${x}</option>`).join('')}</select><label>Descrição</label><input id="uDesc" required placeholder="Ex.: aluguel, fornecedor..."><label>Recorrência</label><select id="uRec"><option>Avulsa</option><option>Semanal</option><option>Mensal</option><option>Anual</option></select><div class="actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div></form></div></div>`}
function saveFuture(e){e.preventDefault();const t=document.getElementById('uType').value;state.future.push({id:Date.now(),type:t,value:Number(document.getElementById('uValue').value),date:document.getElementById('uDate').value,category:document.getElementById('uCat').value,description:document.getElementById('uDesc').value,recurrence:document.getElementById('uRec').value,status:'pending'});save();closeModal();toast('Conta futura adicionada');renderFuturePage()}
function addCard(){const name=prompt('Nome do cartão:');if(!name)return;const last4=prompt('Últimos 4 dígitos:','0000')||'0000';const limit=Number(prompt('Limite:','3000')||0);const due=prompt('Dia do vencimento:','10')||'10';state.cards.push({name,last4:last4.slice(-4),limit,due});save();renderCards();toast('Cartão adicionado')}
function addCategory(){const type=confirm('OK para categoria de DESPESA. Cancelar para RECEITA.')?'expense':'income';const c=prompt('Nome da categoria:');if(!c)return;state.categories[type].push(c);save();renderCategories()}
function backup(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='minha-financa-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exportado')}
function restore(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{state=JSON.parse(r.result);save();toast('Backup restaurado');render()}catch{alert('Arquivo de backup inválido.')}};r.readAsText(f)}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}function toast(t){const r=document.getElementById('toastRoot');r.innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>r.innerHTML='',2200)}function go(s){current=s;render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>go(b.dataset.screen));document.getElementById('fab').onclick=openForm;document.getElementById('prevMonth').onclick=()=>{selectedDate.setMonth(selectedDate.getMonth()-1);render()};document.getElementById('nextMonth').onclick=()=>{selectedDate.setMonth(selectedDate.getMonth()+1);render()};render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body></html>
